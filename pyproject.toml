[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaeil-tidy"
version = "0.1.0"
description = "Turns rough, mixed-style notes into runnable Gaeil code (Irish-language Python)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Almeida" }]
requires-python = ">=3.10"
keywords = ["gaeilge", "irish", "programming-language", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://fitzyracing1.github.io/Gaeil/"
Repository = "https://github.com/fitzyracing1/gaeil-tidy"
"Gaeil language" = "https://github.com/fitzyracing1/Gaeil"

[project.scripts]
gaeil-tidy = "gaeil_tidy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
